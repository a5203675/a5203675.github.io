<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JW 字幕提取工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            /* 明亮乾淨的微灰白背景 */
            background-color: #F8F9FA; 
            color: #333333;
            line-height: 1.6;
        }
        
        .container {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 16px;
            /* 非常輕微的陰影，讓白色區塊像浮在畫面上 */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); 
            border: 1px solid #F0F0F0;
        }

        h2 {
            text-align: center;
            /* 使用官方標誌紫作為視覺重心 */
            color: #5E4286; 
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            margin-top: 0;
        }

        p {
            font-size: 14.5px;
            margin-bottom: 10px;
            color: #666666;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #EAEAEA;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #FCFCFC;
            color: #333;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #5E4286;
            outline: none;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(94, 66, 134, 0.1); 
        }

        textarea {
            height: 320px;
            resize: vertical;
        }

        input::placeholder, textarea::placeholder {
            color: #CCCCCC;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 獲取純文字：視覺最強烈的官方紫 */
        .btn-fetch {
            background-color: #5E4286; 
            color: white;
        }
        .btn-fetch:hover { background-color: #4A3469; }

        /* 複製全部文字：輕盈的淡紫色背景，深紫文字，保持明亮感 */
        .btn-copy {
            background-color: #F2EFFF; 
            color: #5E4286; 
            display: none;
        }
        .btn-copy:hover { background-color: #E6E0FF; }

        /* 下載純文字：極簡的淺灰色，降低干擾 */
        .btn-download {
            background-color: #F0F0F0; 
            color: #555555; 
            display: none;
            margin-bottom: 20px;
        }
        .btn-download:hover { background-color: #E4E4E4; }

    </style>
</head>
<body>

<div class="container">
    <h2>JW 字幕提取工具</h2>
    <p>請貼上 JW Library 的「分享連結」：</p>
    <input type="text" id="urlInput" placeholder="在此貼上連結...">
    
    <button class="btn-fetch" onclick="fetchSubtitles()">獲取純文字</button>
    <button class="btn-copy" id="copyBtn" onclick="copyText()">複製全部文字</button>
    <button class="btn-download" id="downloadBtn" onclick="downloadSubtitles()">下載純文字檔 (.txt)</button>
    
    <textarea id="output" placeholder="字幕純文字會顯示在這裡..."></textarea>
</div>

<script>
    function cleanVttText(vtt) {
        const lines = vtt.split('\n');
        const cleanLines = [];
        
        for (let line of lines) {
            line = line.trim();
            if (!line || line === 'WEBVTT' || line.includes('-->') || /^\d+$/.test(line)) continue;
            if (line.startsWith('NOTE') || line.startsWith('Language:')) continue;
            
            const textOnly = line.replace(/<[^>]+>/g, '');
            cleanLines.push(textOnly);
        }
        return cleanLines.join('\n');
    }

    async function fetchSubtitles() {
        const rawInput = document.getElementById('urlInput').value.trim();
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        if (!rawInput) {
            alert('請先貼上內容喔！');
            return;
        }

        const urlMatch = rawInput.match(/https?:\/\/[^\s]+/);
        if (!urlMatch) {
            output.value = '從你貼上的內容裡找不到有效的網址。\n請確定裡面有包含 https:// 開頭的連結。';
            return;
        }

        const validUrl = urlMatch[0];

        output.value = `解析網址中...\n目標網址：${validUrl}\n請稍候...`;
        downloadBtn.style.display = 'none';
        copyBtn.style.display = 'none';

        try {
            const urlObj = new URL(validUrl);
            const lank = urlObj.searchParams.get('lank') || urlObj.searchParams.get('docid');
            const wtlocale = urlObj.searchParams.get('wtlocale') || 'CH';

            if (!lank) {
                output.value = '網址格式有誤，找不到影片 ID。這可能不是正確的影片連結。';
                return;
            }

            const apiUrl = `https://b.jw-cdn.org/apis/mediator/v1/media-items/${wtlocale}/${lank}`;
            const response = await fetch(apiUrl);
            
            if (!response.ok) throw new Error('找不到影片資料。');
            
            const data = await response.json();

            let vttUrl = '';
            const mediaItems = data.media || [];
            
            for (let item of mediaItems) {
                for (let file of item.files || []) {
                    if (file.subtitles && file.subtitles.url) {
                        vttUrl = file.subtitles.url;
                        break;
                    }
                }
                if (vttUrl) break;
            }

            if (!vttUrl) {
                output.value = '這部影片目前沒有字幕檔可以抓取。';
                return;
            }

            const vttResponse = await fetch(vttUrl);
            const vttText = await vttResponse.text();

            const finalCleanText = cleanVttText(vttText);

            output.value = finalCleanText;
            
            downloadBtn.style.display = 'block';
            copyBtn.style.display = 'block';

        } catch (err) {
            output.value = '發生錯誤了：\n' + err.message;
        }
    }

    function copyText() {
        const text = document.getElementById('output').value;
        if (!text) return;

        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerText;
            const originalBg = copyBtn.style.backgroundColor;
            const originalColor = copyBtn.style.color;
            
            copyBtn.innerText = '✅ 複製成功';
            copyBtn.style.backgroundColor = '#E8F5E9'; /* 明亮的淺綠色背景 */
            copyBtn.style.color = '#2E7D32'; /* 深綠色文字 */
            
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.backgroundColor = originalBg; 
                copyBtn.style.color = originalColor;
            }, 2000);
        }).catch(err => {
            const outputElement = document.getElementById('output');
            outputElement.select();
            outputElement.setSelectionRange(0, 99999); 
            document.execCommand('copy');
            alert('已複製到剪貼簿！');
        });
    }

    function downloadSubtitles() {
        const text = document.getElementById('output').value;
        if (!text) return;
        
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        a.href = url;
        a.download = 'JW_字幕.txt';
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }
</script>

</body>
</html>
